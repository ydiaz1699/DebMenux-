# ==========================================================
# DebMenux — Configuración de Automontaje USB
# ==========================================================
# Archivo: /etc/usb-automount.conf
# Generado por: debmenu → Post-Instalación → Automontaje USB
#
# Edita este archivo para personalizar el comportamiento.
# Después de cambios, recarga udev: sudo udevadm control --reload-rules
# ==========================================================

# --------------------------------------------------------------------------
# RUTA BASE DE MONTAJE
# --------------------------------------------------------------------------
# Directorio donde se crean los puntos de montaje automáticos.
# Cada USB se monta en: $MOUNT_BASE/usb-<dispositivo>
# Alternativas comunes: /media, /mnt/usb, /mnt
MOUNT_BASE="/media"

# --------------------------------------------------------------------------
# FILTROS
# --------------------------------------------------------------------------
# Tamaño mínimo de partición en MB para ser montada.
# Particiones más pequeñas (ej. particiones EFI de 100MB) se ignoran.
MIN_SIZE_MB=100

# --------------------------------------------------------------------------
# PERMISOS
# --------------------------------------------------------------------------
# UID y GID para montar filesystems que no soportan permisos nativos
# (FAT32, exFAT, NTFS). Usa `id <usuario>` para obtener los valores.
DEFAULT_UID=1000
DEFAULT_GID=1000

# --------------------------------------------------------------------------
# LOGGING
# --------------------------------------------------------------------------
# Archivo de log principal
LOG_FILE="/var/log/usb-automount.log"

# Nivel de log: DEBUG, INFO, WARNING, ERROR
LOG_LEVEL="INFO"

# --------------------------------------------------------------------------
# SEGURIDAD
# --------------------------------------------------------------------------
# Opciones de montaje base (se aplican a todos los filesystems)
# noexec: no permitir ejecución de binarios
# nosuid: ignorar bits SUID/SGID
# nodev: no interpretar dispositivos especiales
MOUNT_OPTIONS="noexec,nosuid,nodev"

# Lista blanca: solo montar dispositivos listados (por UUID o nombre)
# Archivo: /etc/usb-automount-whitelist.conf (un UUID/nombre por línea)
WHITELIST_ENABLED="false"
WHITELIST_FILE="/etc/usb-automount-whitelist.conf"

# Lista negra: nunca montar dispositivos listados
# Archivo: /etc/usb-automount-blacklist.conf (un UUID/nombre por línea)
BLACKLIST_ENABLED="false"
BLACKLIST_FILE="/etc/usb-automount-blacklist.conf"

# Rate limiting: máx intentos de montaje por dispositivo en ventana de tiempo
RATE_LIMIT_MAX=5
RATE_LIMIT_WINDOW=60

# --------------------------------------------------------------------------
# TIMEOUTS
# --------------------------------------------------------------------------
# Tiempo máximo (segundos) para intentar montar
TIMEOUT_MOUNT=30

# Tiempo máximo (segundos) para intentar desmontar
TIMEOUT_UNMOUNT=10

# --------------------------------------------------------------------------
# NOTIFICACIONES (opcional)
# --------------------------------------------------------------------------
# Enviar notificaciones de escritorio al montar/desmontar
# Requiere: libnotify-bin (notify-send)
ENABLE_NOTIFICATIONS="false"

# --------------------------------------------------------------------------
# OPCIONES DE MONTAJE POR FILESYSTEM
# --------------------------------------------------------------------------
# Sobreescriben MOUNT_OPTIONS para filesystems específicos.
# Si están vacías, se usa MOUNT_OPTIONS + permisos por defecto.

# NTFS (requiere ntfs-3g)
MOUNT_OPTIONS_NTFS=""

# FAT32
MOUNT_OPTIONS_VFAT=""

# exFAT (requiere exfatprogs o exfat-fuse)
MOUNT_OPTIONS_EXFAT=""

# ext2/ext3/ext4
MOUNT_OPTIONS_EXT=""

# Btrfs
MOUNT_OPTIONS_BTRFS=""

# XFS
MOUNT_OPTIONS_XFS=""

# F2FS
MOUNT_OPTIONS_F2FS=""
